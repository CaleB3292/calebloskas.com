<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Cale Bloskas</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1f33">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .notfound {
      min-height: 100vh; min-height: 100svh;
      display: grid; align-items: center;
      padding: 120px 0 80px;
      color: var(--white);
      background:
        radial-gradient(circle at 80% 25%, rgba(255, 255, 255, 0.09), transparent 28rem),
        radial-gradient(circle at 8% 92%, rgba(201, 169, 110, 0.10), transparent 26rem),
        linear-gradient(135deg, var(--navy-deep), var(--navy));
    }
    .notfound-code {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: clamp(6rem, 18vw, 12rem);
      line-height: 0.9; letter-spacing: -0.06em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.35);
    }
    .notfound h1 {
      margin: 0 0 18px;
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(2rem, 4vw, 3.2rem); letter-spacing: -0.035em; line-height: 1.1;
    }
    .notfound p.lede { max-width: 520px; margin: 0 0 36px; color: rgba(255, 255, 255, 0.75); font-size: 1.1rem; }
    .notfound .section-label { color: rgba(255, 255, 255, 0.68); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="/"><img src="/brand/cb-monogram-small.svg" alt="" width="34" height="34">Cale Bloskas</a>
      <nav aria-label="Primary navigation">
        <a href="/#about">About</a>
        <a href="/#expertise">Expertise</a>
        <a href="/#connect">Connect</a>
      </nav>
    </div>
  </header>

  <main class="notfound">
    <div class="shell">
      <p class="section-label">Error 404</p>
      <p class="notfound-code" aria-hidden="true">404</p>
      <h1>This page took a wrong turn.</h1>
      <p class="lede">The link may be old or mistyped. Everything you're looking for is on the home page.</p>
      <div class="hero-actions" style="opacity:1;transform:none;animation:none">
        <a class="button button-primary" href="/">Back to home</a>
        <a class="button button-secondary" href="mailto:hello@calebloskas.com">Email me</a>
      </div>
    </div>
  </main>
</body>
</html>
